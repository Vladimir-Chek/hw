<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .item, .item00, .item0, .item1, .item2, .item3, .item4, .item5 {
        background-color: transparent;
        padding: 0;
    }
    
div > div {
        background-color: white;
        padding: 20px;
        border-radius: 16px;
        min-width: 50px;
        text-align: center;
        flex: auto;
    }

    body {
        height: 100vh;
        background-color: #1a1a1a;
        color: white;
        padding: 20px;
        display: flex; 
        align-items: stretch; 
        justify-content: center;
    }
    .item{
        display: flex;
        flex-direction: row;
        gap: 16px;
        width: 100%;
        flex: 1;
    }
    .item00{
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .item0{
        display: flex;
        flex-direction: row;
        gap: 16px;
    }
    .item1{
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .item2{
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .item3{
        display: flex;
        flex-direction: row;
        gap: 16px;
    }
    .item4{
        display: flex;
        flex-direction: row;
        gap: 16px;
    }
    .item5{
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
</style>
<body>
    <div class="item">
        <div class="item00">
            <div class="item0">
                <div class="item1">
                    <div>x1</div>
                    <div>x2</div>
                </div>
                <div class="item2">
                    <div class="item3">
                        <div>z1</div>
                        <div>z2</div>
                    </div>
                    <div>z3</div>
                </div>
            </div>
            <div class="item4">
                <div>b1</div>
                <div>b2</div>
            </div>
        </div>
        
        <div class="item5">
            <div>c1</div>
            <div>c2</div>
        </div>
    </div>

</body>
</html>
